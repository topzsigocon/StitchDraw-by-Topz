name: Unpack update.zip

# Upload update.zip to the repository root (via web UI or git) and push.
# The zip must contain project files at its top level (app/, workspace/, ...).
# Files are overwritten; nothing is deleted unless listed in DELETE.txt inside the zip.

on:
  push:
    paths: [ "update.zip" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack update.zip
        run: |
          set -e
          test -f update.zip || { echo "update.zip not found"; exit 1; }
          rm -rf .update_tmp && mkdir .update_tmp
          unzip -q update.zip -d .update_tmp
          # If the zip wraps everything in one folder, step into it
          src=.update_tmp
          if [ "$(ls -A .update_tmp | wc -l)" = "1" ] && [ -d ".update_tmp/$(ls .update_tmp)" ]; then
            src=".update_tmp/$(ls .update_tmp)"
          fi
          # Safety: refuse path traversal and protect workflow/wrapper-less updates
          if unzip -Z1 update.zip | grep -E '(^|/)\.\.(/|$)'; then echo "unsafe paths"; exit 1; fi
          if [ -f "$src/DELETE.txt" ]; then
            while IFS= read -r f; do
              case "$f" in ""|/*|*..*) continue;; esac
              rm -rf -- "./$f"
            done < "$src/DELETE.txt"
            rm "$src/DELETE.txt"
          fi
          cp -a "$src"/. .
          rm -rf .update_tmp update.zip
          chmod +x gradlew || true

      - name: Commit changes
        run: |
          git config user.name  "stitchdraw-bot"
          git config user.email "stitchdraw-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Apply update.zip"
          git push
