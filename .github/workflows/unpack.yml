name: Unpack update.zip

# Only unpacks. The build is done by "Android CI", which starts by itself when this workflow finishes.
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Walang .zip sa root; walang gagawin."
            exit 0
          fi
          for z in "${zips[@]}"; do
            unzip -o "$z" -x ".github/*"
            git rm -q -f "$z"
          done
          # Delete the paths listed in REMOVE.txt (one per line). .git*, .. and absolute paths are not allowed.
          if [ -f REMOVE.txt ]; then
            while IFS= read -r path || [ -n "$path" ]; do
              case "$path" in
                ''|'#'*|.git*|*..*|/*) continue ;;
              esac
              git rm -r -q --ignore-unmatch -- "$path"
            done < REMOVE.txt
            rm -f REMOVE.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack update zip" || echo "Walang pagbabago"
          git push
