name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  # Pushes made by an unpack workflow use the bot token, which GitHub does not let trigger "push" workflows,
  # so build explicitly once the unpack workflow has finished.
  workflow_run:
    workflows: [ "Unpack update.zip", "Unpack zip and build" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  build:
    # runs after the unpack workflow whatever its result: the unpacked files are committed in its second step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the project is unpacked
        run: |
          ls -la
          if [ ! -d app ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::The project is NOT unpacked yet (app/ or gradle/wrapper is missing; update.zip is still in the repo root?). Run the workflow 'Unpack zip and build' first (Actions tab > Run workflow)."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: GitHub's runners already ship the Android SDK (ANDROID_HOME) with licences accepted,
      # and android-actions/setup-android@v3 crashes its sdkmanager under Node 24.

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests (engines + workspace)
        id: tests
        continue-on-error: true
        run: ./gradlew test --stacktrace --continue

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: StitchDraw-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Fail the job if tests or build failed
        if: steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

  # Collects the logs after the build job has finished and publishes a SHORT report to the branch "ci-report",
  # so nobody has to copy a long log by hand.
  report:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Collect logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          mkdir -p /tmp/out
          R=/tmp/out/ci-report.txt
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" > /tmp/out/jobs.json 2> /tmp/out/jobs.err
          {
            echo "run=$RUN_ID commit=${GITHUB_SHA::7} build-job=${{ needs.build.result }}"
            echo
            echo "=== JOBS OF THIS RUN ==="
            jq -r '.jobs[] | "\(.id)  \(.name)  \(.status)  \(.conclusion)"' /tmp/out/jobs.json
            echo
            echo "=== STEPS OF THE BUILD JOB ==="
            jq -r '.jobs[] | select(.name != "report") | .steps[] | "\(.number). \(.name): \(.conclusion)"' /tmp/out/jobs.json
            echo
            echo "=== API ERRORS (if any) ==="
            cat /tmp/out/jobs.err
            echo
            echo "=== FILES IN THE REPO ROOT AT THIS COMMIT ==="
            ls -a
          } > "$R" 2>&1
          JOB=$(jq -r '.jobs[] | select(.name != "report") | .id' /tmp/out/jobs.json | head -1)
          {
            echo
            echo "=== ERROR LINES IN THE BUILD JOB LOG ==="
            grep -n -E '##\[error\]|^e: |FAILED|What went wrong|Execution failed|AssertionError|Error:' /tmp/out/job.log | head -150
            echo
            echo "=== LAST 40 LINES OF THE BUILD JOB LOG ==="
            tail -40 /tmp/out/job.log
            echo
            echo "=== RECENT RUNS OF ALL WORKFLOWS ==="
            gh run list --repo "$REPO" --limit 8 --json databaseId,name,event,conclusion,headSha --jq '.[] | "\(.databaseId)  \(.name)  \(.event)  \(.conclusion)  \(.headSha[0:7])"'
          } >> "$R" 2>&1
          for ID in $(gh run list --repo "$REPO" --limit 8 --json databaseId,conclusion,name --jq '.[] | select(.conclusion=="failure" and .name!="Android CI") | .databaseId' | head -2); do
            {
              echo
              echo "=== FAILED STEP LOG OF RUN $ID (another workflow) ==="
              gh run view "$ID" --repo "$REPO" --log-failed 2>&1 | tail -120
            } >> "$R"
          done
          tail -n 4000 /tmp/out/job.log > /tmp/out/job-tail.log; mv /tmp/out/job-tail.log /tmp/out/job.log
          head -c 60000 "$R" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish report to branch ci-report
        run: |
          git config user.name  "stitchdraw-bot"
          git config user.email "stitchdraw-bot@users.noreply.github.com"
          git checkout --orphan ci-report-tmp
          git rm -rf . -q
          cp /tmp/out/ci-report.txt /tmp/out/job.log .
          git add -f ci-report.txt job.log
          git commit -q -m "CI report for ${GITHUB_SHA::7}"
          git push -f origin HEAD:refs/heads/ci-report
